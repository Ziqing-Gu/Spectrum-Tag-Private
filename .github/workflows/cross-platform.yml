name: Transfer validated installers to the draft
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpectrumTag-2.0.10-macOS-Installer
          path: Mac
          run-id: 44293590981
          github-token: ${{ github.token }}
      - name: Assemble bilingual installer delivery and upload to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          test "$(gh release view v2.0.10 --json isDraft --jq .isDraft)" = true
          test "$(gh release view v2.0.10 --json targetCommitish --jq .targetCommitish)" = 654cfb47cee71aa8046a392fd77f3533f8e273b7
          mkdir Win
          gh release download v2.0.10 -p 'SpectrumTag-2.0.10-Windows-Setup.exe' -D Win
          gh release download v2.0.10 -p 'default.txt' -O 安装说明.txt
          gh release download v2.0.10 -p 'Installation-Guide.txt'
          echo '2db8d28660e681a4befbe8affbe81ce91978a82e9266bef59172c5c2031cc109  Win/SpectrumTag-2.0.10-Windows-Setup.exe' | sha256sum -c
          echo 'bcd417f4deb65e39eb3fe44eb49529e1d1284dd52cc5752e76eaddb2c009a231  安装说明.txt' | sha256sum -c
          echo 'e77506f13eacba7bf133eeda44c4c07984804cf6377c5e904b56a2307cb41c80  Installation-Guide.txt' | sha256sum -c
          python3 - <<'PY'
          import zipfile,shutil,pathlib
          names=['Win/SpectrumTag-2.0.10-Windows-Setup.exe','Mac/SpectrumTag-2.0.10-macOS.pkg','安装说明.txt','Installation-Guide.txt']
          with zipfile.ZipFile('SpectrumTag-2.0.10-Installers.zip','x',compression=zipfile.ZIP_STORED) as z:
              for name in names:
                  entry=zipfile.ZipInfo(name,date_time=(2026,11,18,0,0,0))
                  entry.create_system=3
                  entry.external_attr=0o100644 << 16
                  with z.open(entry,'w') as target,pathlib.Path(name).open('rb') as source: shutil.copyfileobj(source,target)
          PY
          sha256sum Mac/*.pkg *.zip
          gh release upload v2.0.10 Mac/*.pkg *.zip
